<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="{{csrf_token}}" name="csrf-token"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" rel="stylesheet"/>
    <link href="/assets/app.css" rel="stylesheet"/>
    <title>Catalogue</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
</head>
<body class="bg-light" data-page="catalogue">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0"><i class="fa-solid fa-book-open me-2"></i>Catalogue</h1>
            <div class="text-muted small">Categories and currencies</div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary btn-sm" data-requires-role="ROLE_EDITOR" data-route="example.products.list.page" href="#">
                <i class="fa-solid fa-boxes-stacked me-1"></i>Products
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-requires-role="ROLE_ADMIN" data-route="example.users.list.page" href="#">
                <i class="fa-solid fa-users me-1"></i>Users
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-route="example.twofactor.page" href="#">
                <i class="fa-solid fa-shield-halved me-1"></i>Second factor
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-route="example.routes" href="#">
                <i class="fa-solid fa-route me-1"></i>Routes (JSON)
            </a>
            <form class="d-inline" method="post" action="/logout/" data-route="example.logout">
                <input name="_csrf_token" type="hidden" value="{{csrf_token}}"/>
                <button class="btn btn-outline-secondary btn-sm" type="submit"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
            </form>
        </div>
    </div>

    <div class="alert alert-info py-2" id="status">Loading...</div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header"><i class="fa-solid fa-tags me-2"></i>Categories</div>
                <div class="card-body">
                    <form class="row g-2 mb-3" data-requires-role="ROLE_EDITOR" id="categoryCreateForm">
                        <div class="col-sm-4">
                            <input class="form-control form-control-sm" id="categoryCreateId" maxlength="60" placeholder="Id (optional)" type="text"/>
                        </div>
                        <div class="col-sm-5">
                            <input class="form-control form-control-sm" id="categoryCreateName" maxlength="120" placeholder="Name" required type="text"/>
                        </div>
                        <div class="col-sm-3 d-grid">
                            <button class="btn btn-primary btn-sm" type="submit"><i class="fa-solid fa-plus me-1"></i>Add</button>
                        </div>
                    </form>
                    <div class="alert alert-danger py-1 small d-none" id="categoryError"></div>
                    <table class="table table-sm align-middle mb-0" id="categoriesTable">
                        <thead>
                        <tr>
                            <th style="width: 40%">Id</th>
                            <th>Name</th>
                            <th class="text-end" data-requires-role="ROLE_EDITOR">Actions</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header"><i class="fa-solid fa-coins me-2"></i>Currencies</div>
                <div class="card-body">
                    <table class="table table-sm align-middle mb-0" id="currenciesTable">
                        <thead>
                        <tr>
                            <th style="width: 25%">Code</th>
                            <th>Name</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" type="text/javascript"></script>
<script type="text/javascript">window.melodyRoutes = JSON.parse('{{routes_json}}');</script>
<script type="text/javascript">window.melodyViewer = JSON.parse('{{viewer_json}}');</script>
<script src="/assets/app.js" type="text/javascript"></script>
<script type="text/javascript">
    $(document).ready(() => {
        const categoriesBody = $('#categoriesTable tbody');
        const currenciesBody = $('#currenciesTable tbody');
        if (0 === categoriesBody.length || 0 === currenciesBody.length) {
            return;
        }

        const renderRows = (tableBody, items, firstKey, secondKey) => {
            tableBody.empty();

            if (0 === items.length) {
                const emptyRow = $('<tr/>');
                $('<td/>').attr('colspan', 2).addClass('text-muted').text('Nothing recorded.').appendTo(emptyRow);
                tableBody.append(emptyRow);
                return;
            }

            for (const item of items) {
                const row = $('<tr/>');
                $('<td/>').text(String(item?.[firstKey] ?? '').trim()).appendTo(row);
                $('<td/>').text(String(item?.[secondKey] ?? '').trim()).appendTo(row);
                tableBody.append(row);
            }
        };

        const editsCategories = window.melodyExample.viewer.holdsRole('ROLE_EDITOR');
        const categoryError = $('#categoryError');

        const showCategoryError = (err) => {
            const message = String(err?.message ?? err ?? '').trim();
            categoryError.text(message).toggleClass('d-none', '' === message);
        };

        const renderCategories = (items) => {
            categoriesBody.empty();

            if (0 === items.length) {
                const emptyRow = $('<tr/>');
                $('<td/>').attr('colspan', editsCategories ? 3 : 2).addClass('text-muted').text('Nothing recorded.').appendTo(emptyRow);
                categoriesBody.append(emptyRow);
                return;
            }

            for (const item of items) {
                const id = String(item?.id ?? '').trim();
                const name = String(item?.name ?? '').trim();
                const row = $('<tr/>');
                $('<td/>').text(id).appendTo(row);
                $('<td/>').text(name).appendTo(row);

                if (true === editsCategories) {
                    const actions = $('<td/>').addClass('text-end text-nowrap').appendTo(row);
                    $('<button type="button"/>').addClass('btn btn-outline-secondary btn-sm me-1').attr('title', 'Rename')
                        .append($('<i/>').addClass('fa-solid fa-pen'))
                        .on('click', () => void renameCategory(id, name))
                        .appendTo(actions);
                    $('<button type="button"/>').addClass('btn btn-outline-danger btn-sm').attr('title', 'Delete')
                        .append($('<i/>').addClass('fa-solid fa-trash'))
                        .on('click', () => void deleteCategory(id))
                        .appendTo(actions);
                }

                categoriesBody.append(row);
            }
        };

        const loadCategories = async () => {
            const categoriesResult = await window.melodyExample.http.getJson(
                window.melodyExample.routing.route('example.categories.api.read.all')
            );

            renderCategories(Array.isArray(categoriesResult?.payload) ? categoriesResult.payload : []);
        };

        const writeCategory = async (write) => {
            showCategoryError('');

            try {
                await write();
                await loadCategories();
            } catch (err) {
                showCategoryError(err);
            }
        };

        const renameCategory = async (id, name) => {
            const renamed = window.prompt('New name for ' + id, name);
            if (null === renamed || '' === renamed.trim() || name === renamed.trim()) {
                return;
            }

            await writeCategory(() => window.melodyExample.http.putJson(
                window.melodyExample.routing.route('example.categories.api.update', {id: id}),
                {name: renamed.trim()}
            ));
        };

        const deleteCategory = async (id) => {
            if (false === window.confirm('Delete the category ' + id + '?')) {
                return;
            }

            await writeCategory(() => window.melodyExample.http.deleteJson(
                window.melodyExample.routing.route('example.categories.api.delete', {id: id})
            ));
        };

        $('#categoryCreateForm').on('submit', (submitEvent) => {
            submitEvent.preventDefault();

            const idInput = $('#categoryCreateId');
            const nameInput = $('#categoryCreateName');

            void writeCategory(async () => {
                await window.melodyExample.http.postJson(
                    window.melodyExample.routing.route('example.categories.api.create'),
                    {id: String(idInput.val() ?? '').trim(), name: String(nameInput.val() ?? '').trim()}
                );
                idInput.val('');
                nameInput.val('');
            });
        });

        const load = async () => {
            window.melodyExample.ui.setStatus('Loading catalogue...');

            try {
                await loadCategories();

                const currenciesResult = await window.melodyExample.http.getJson(
                    window.melodyExample.routing.route('example.currencies.api.read.all')
                );

                renderRows(currenciesBody, Array.isArray(currenciesResult?.payload) ? currenciesResult.payload : [], 'code', 'name');

                window.melodyExample.ui.setStatus('');
            } catch (err) {
                window.melodyExample.ui.setStatus(String(err?.message ?? err), 'danger');
            }
        };

        void load();
    });
</script>
</body>
</html>
