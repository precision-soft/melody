services:
    dev:
        build:
            context: ${RELATIVE_PATH_TO_ROOT}
            dockerfile: ${DOCKER_PATH}/Dockerfile
            args:
                DOCKER_PATH: ${DOCKER_PATH}
                WORKDIR: ${CONTAINER_ROOT_PATH}
                CONFIG_PATH: ${DOCKER_PATH}
                ROOT_PATH: ${CONTAINER_ROOT_PATH}
        restart: 'no'
        environment:
            MELODY_DEV_REFLEX_ENABLED: ${MELODY_DEV_REFLEX_ENABLED:-1}
            MELODY_DEV_EXAMPLE_DIR: ${MELODY_DEV_EXAMPLE_DIR:-/app/v3/.example}
            MELODY_DEV_RUN_COMMAND: ${MELODY_DEV_RUN_COMMAND:-go run .}
            # note: the example's live-integration endpoints (MYSQL_HOST, REDIS_ADDRESS,
            # AMQP_DSN, S3_*, SMTP_ADDRESS) live in v3/.example/.env and are loaded into the
            # example process by its main() — deliberately NOT set here as container-wide
            # environment, so `docker compose exec dev go test` (pre-push validation) does
            # not inherit them and the env-gated integration tests skip cleanly instead of
            # dialing services that the validation run does not start.
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}:${CONTAINER_ROOT_PATH}
            # note: the go module and build caches live in named volumes, NOT host bind
            # mounts: the go linker opens thousands of cache files in parallel and the
            # Docker Desktop file-sharing daemon runs out of file descriptors ("too many
            # open files" during go test ./...), besides being an order of magnitude
            # slower for cache-heavy workloads. Named volumes stay inside the VM.
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/go/cache
            - ${RELATIVE_PATH_TO_ROOT}/.dev-data/bash/.bash_history:/home/.bash_history
        ports:
            - "${DEV_HTTP_HOST_PORT:-8180}:8080"

    # the v1 and v2 example applications, supervised the same way the v3 one is. They are the same image
    # with a different example directory: the entrypoint takes MELODY_DEV_EXAMPLE_DIR, so nothing about it
    # is per-major. No host port is published — they are reached through the load balancer by hostname,
    # which keeps the host port map (.dev/docker/.env.local, per developer) out of this entirely.
    dev-v1:
        build:
            context: ${RELATIVE_PATH_TO_ROOT}
            dockerfile: ${DOCKER_PATH}/Dockerfile
            args:
                DOCKER_PATH: ${DOCKER_PATH}
                WORKDIR: ${CONTAINER_ROOT_PATH}
                CONFIG_PATH: ${DOCKER_PATH}
                ROOT_PATH: ${CONTAINER_ROOT_PATH}
        restart: 'no'
        environment:
            MELODY_DEV_REFLEX_ENABLED: ${MELODY_DEV_V1_REFLEX_ENABLED:-1}
            MELODY_DEV_EXAMPLE_DIR: /app/.example
            MELODY_DEV_RUN_COMMAND: ${MELODY_DEV_RUN_COMMAND:-go run .}
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}:${CONTAINER_ROOT_PATH}
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/go/cache
            - ${RELATIVE_PATH_TO_ROOT}/.dev-data/bash/.bash_history:/home/.bash_history

    dev-v2:
        build:
            context: ${RELATIVE_PATH_TO_ROOT}
            dockerfile: ${DOCKER_PATH}/Dockerfile
            args:
                DOCKER_PATH: ${DOCKER_PATH}
                WORKDIR: ${CONTAINER_ROOT_PATH}
                CONFIG_PATH: ${DOCKER_PATH}
                ROOT_PATH: ${CONTAINER_ROOT_PATH}
        restart: 'no'
        environment:
            MELODY_DEV_REFLEX_ENABLED: ${MELODY_DEV_V2_REFLEX_ENABLED:-1}
            MELODY_DEV_EXAMPLE_DIR: /app/v2/.example
            MELODY_DEV_RUN_COMMAND: ${MELODY_DEV_RUN_COMMAND:-go run .}
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}:${CONTAINER_ROOT_PATH}
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/go/cache
            - ${RELATIVE_PATH_TO_ROOT}/.dev-data/bash/.bash_history:/home/.bash_history

    load-balancer:
        image: nginx:1.27-alpine
        restart: 'no'
        depends_on:
            - dev
            - dev-v1
            - dev-v2
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}/${DOCKER_PATH}/load-balancer/vhost.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "${LOAD_BALANCER_HTTP_HOST_PORT:-80}:80"

    rabbitmq:
        image: rabbitmq:3.13-management
        profiles: [ 'all' ]
        restart: 'no'
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "${RABBITMQ_HOST_PORT:-5673}:5672"
            - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
        healthcheck:
            test: [ 'CMD-SHELL', 'rabbitmq-diagnostics -q ping' ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        profiles: [ 'all' ]
        restart: 'no'
        ports:
            - "${REDIS_HOST_PORT:-6380}:6379"
        healthcheck:
            test: [ 'CMD-SHELL', 'redis-cli ping' ]
            interval: 5s
            timeout: 5s
            retries: 20

    mysql:
        image: mysql:8.4
        profiles: [ 'all' ]
        restart: 'no'
        environment:
            MYSQL_ROOT_PASSWORD: root
            # the scratch database of the live integration suites, which point MYSQL_DSN at it and create
            # tables of their own. The .example applications do NOT use it: each holds its schema in a
            # melody_example_v<major> database of its own, created by the init script mounted below.
            MYSQL_DATABASE: melody_example
            MYSQL_USER: melody
            MYSQL_PASSWORD: melody
        ports:
            - "${MYSQL_HOST_PORT:-3307}:3306"
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}/${DOCKER_PATH}/mysql/init.sql:/docker-entrypoint-initdb.d/10-example-databases.sql:ro
        healthcheck:
            test: [ 'CMD-SHELL', 'mysqladmin ping -h localhost -proot' ]
            interval: 5s
            timeout: 5s
            retries: 20

    localstack:
        image: localstack/localstack:3.8
        profiles: [ 'all' ]
        restart: 'no'
        environment:
            SERVICES: s3
            DEFAULT_REGION: eu-central-1
            PERSISTENCE: 1
            LS_LOG: warn
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}/.dev-data/localstack:/var/lib/localstack
        ports:
            - "${LOCALSTACK_HOST_PORT:-4566}:4566"
        healthcheck:
            test: [ 'CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health' ]
            interval: 5s
            timeout: 5s
            retries: 20

    postgres:
        image: postgres:16-alpine
        profiles: [ 'all' ]
        restart: 'no'
        environment:
            POSTGRES_USER: melody
            POSTGRES_PASSWORD: melody
            POSTGRES_DB: melody_test
        ports:
            - "${POSTGRES_HOST_PORT:-5433}:5432"
        healthcheck:
            test: [ 'CMD-SHELL', 'pg_isready -U melody' ]
            interval: 5s
            timeout: 5s
            retries: 20

    mailpit:
        image: axllent/mailpit
        profiles: [ 'all' ]
        restart: 'no'
        ports:
            - "${MAILPIT_SMTP_HOST_PORT:-1026}:1025"
            - "${MAILPIT_UI_HOST_PORT:-8026}:8025"
        healthcheck:
            test: [ 'CMD', '/mailpit', 'readyz' ]
            interval: 5s
            timeout: 5s
            retries: 20

    prometheus:
        image: prom/prometheus:v2.54.1
        profiles: [ 'all' ]
        restart: 'no'
        depends_on:
            - dev
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}/${DOCKER_PATH}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        ports:
            - "${PROMETHEUS_HOST_PORT:-9091}:9090"

    otel-collector:
        image: otel/opentelemetry-collector:0.109.0
        profiles: [ 'all' ]
        restart: 'no'
        command: [ "--config=/etc/otel-collector-config.yaml" ]
        volumes:
            - ${RELATIVE_PATH_TO_ROOT}/${DOCKER_PATH}/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
        ports:
            - "${OTEL_COLLECTOR_GRPC_HOST_PORT:-4317}:4317"
            - "${OTEL_COLLECTOR_HTTP_HOST_PORT:-4318}:4318"

volumes:
    go-mod-cache:
    go-build-cache:
