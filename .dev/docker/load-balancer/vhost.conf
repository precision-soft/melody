# the v3 example keeps the unprefixed name: it is the one the dev container supervises by default and the
# one every existing bookmark, harness constant and document already points at.
server {
    listen 80;

    server_name example.melody.localhost.precision-soft.com;
    index index.html;

    error_log /dev/stderr;
    access_log /dev/stdout;

    location / {
        client_max_body_size 128M;

        set $example_upstream "http://dev:8080";
        proxy_pass $example_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support (the example exposes /ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
