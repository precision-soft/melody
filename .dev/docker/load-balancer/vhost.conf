resolver 127.0.0.11 ipv6=off valid=10s;

# One vhost per example application, so all three majors are reachable at once under names that say
# which is which. They are separate containers, so each listens on 8080 inside its own network
# namespace and nothing collides; none of them publishes a host port.

server {
    listen 80;

    server_name v1-example.melody.localhost.precision-soft.com;
    index index.html;

    error_log /dev/stderr;
    access_log /dev/stdout;

    location / {
        client_max_body_size 128M;

        # resolved at request time via the docker dns resolver so the proxy
        # starts even before the example container is up
        set $example_upstream "http://dev-v1:8080";
        proxy_pass $example_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

