# the v3 example keeps the unprefixed name: it is the one the dev container supervises by default and the
# one every existing bookmark, harness constant and document already points at.
server {
    listen 80;

    server_name example.melody.localhost.precision-soft.com;
    index index.html;

    error_log /dev/stderr;
    access_log /dev/stdout;

    location / {
        client_max_body_size 128M;

        set $example_upstream "http://dev:8080";
        proxy_pass $example_upstream;

        # $http_host, not $host: $host is derived from server_name and carries no port, so an application
        # behind this proxy was told a different host than the browser had asked for whenever the stack is
        # published on any port but 80. A same-origin check compares the two — coder/websocket's does, and it
        # refused every /ws upgrade with 403 on a developer's mapped port while a foreign origin was refused
        # by the same answer, so nothing distinguished the two — and the host forwarded here has to be the
        # one the client actually used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support (the example exposes /ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# The exchange-rate provider the v3 example calls through melody/v3/httpclient. It is a separate host with
# its own name, so from the application's point of view it is a foreign origin reached over the network —
# which is the only shape that exercises the client's base-url resolution, its same-origin refusal and its
# connection pool. It is deliberately NOT on the public internet: the gate has twice spent a session
# diagnosing external DNS and network degradation, and govulncheck is the one band allowed to need it.
#
# The nominal path answers from nginx itself rather than proxying anywhere, so the document is a constant
# and every assertion about it is deterministic. The three failure locations exist because the arms that
# matter for an outbound client are the ones that do not answer 200, and an application-level retry cannot
# be proved against a server that never refuses.
server {
    listen 80;

    server_name rates.melody.localhost.precision-soft.com;

    error_log /dev/stderr;
    access_log /dev/stdout;

    # the rates are quoted against the base, one unit of the base costing this many units of the currency.
    # The three codes are the ones the example seeds; asOf is the instant the provider took the reading,
    # which is what the application stores rather than the moment it happened to fetch.
    location = /v1/latest {
        default_type application/json;
        return 200 '{"base":"EUR","asOf":"2026-09-07T09:00:00Z","rates":{"EUR":1,"USD":1.0842,"RON":4.9761}}';
    }

    # the sink the catalogue report is exported to. It answers what it received in shape only: the export
    # checks the status and does not read the body for content.
    location = /v1/report-sink {
        default_type application/json;
        return 200 '{"accepted":true}';
    }

    # The failure arms are BASES rather than targets, each answering under the same "latest" name the
    # application asks for, because that is the only way a band can drive them: the target is a constant in
    # the code and the base is configuration, so pointing RATES_BASE_URL at one of these exercises a real
    # failure through the real wiring instead of a second code path written for the test.
    location = /unavailable/latest {
        return 503;
    }

    # a 200 whose body is not json at all, so the decode fails after a successful exchange — the arm that
    # separates "the call failed" from "the answer was unusable", and the one a retry must NOT repeat
    location = /malformed/latest {
        default_type application/json;
        return 200 'not json at all';
    }

    # a 404 stands for the whole 4xx class: an answer the reading cannot be taken from and that repeating
    # would only repeat, which is why the retry is narrower than "anything that was not a 200"
    location = /missing/latest {
        return 404;
    }

    # 192.0.2.0/24 is TEST-NET-1 (RFC 5737): reserved for documentation and guaranteed not to be routed, so
    # the connect never completes and never refuses. That is the only way to hold a request open without a
    # delay directive stock nginx does not have, and it is what a per-request timeout has to be measured
    # against. proxy_connect_timeout is nginx's own ceiling, far above any client budget under test.
    location = /blackhole/latest {
        proxy_pass http://192.0.2.1:80;
        proxy_connect_timeout 75s;
    }
}
