# dev-only prometheus that scrapes the example app's opentelemetry /metrics endpoint,
# so the metrics pipeline (integration → /metrics → collector) can be exercised end-to-end.
global:
    scrape_interval: 5s
    scrape_timeout: 3s

scrape_configs:
    -   job_name: melody-example
        metrics_path: /metrics
        # the third example answers /metrics only to a caller presenting APP_METRICS_TOKEN (v3/.example/.env)
        authorization:
            type: Bearer
            credentials: melody-example-metrics-scrape-token-0001
        static_configs:
            -   targets: [ 'dev:8080' ]
