<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
    <link href="/assets/app.css" rel="stylesheet"/>
    <title>Catalogue</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
</head>
<body class="bg-light" data-page="catalogue">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0"><i class="fa-solid fa-book-open me-2"></i>Catalogue</h1>
            <div class="text-muted small">Read-only</div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary btn-sm" data-requires-role="ROLE_EDITOR" data-route="example.products.list.page" href="#">
                <i class="fa-solid fa-boxes-stacked me-1"></i>Products
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-requires-role="ROLE_ADMIN" data-route="example.users.list.page" href="#">
                <i class="fa-solid fa-users me-1"></i>Users
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-route="example.routes" href="#">
                <i class="fa-solid fa-route me-1"></i>Routes (JSON)
            </a>
            <a class="btn btn-outline-secondary btn-sm" data-route="example.logout" href="#">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </a>
        </div>
    </div>

    <div class="alert alert-info py-2" id="status">Loading...</div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header"><i class="fa-solid fa-tags me-2"></i>Categories</div>
                <div class="card-body">
                    <table class="table table-sm align-middle mb-0" id="categoriesTable">
                        <thead>
                        <tr>
                            <th style="width: 40%">Id</th>
                            <th>Name</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header"><i class="fa-solid fa-coins me-2"></i>Currencies</div>
                <div class="card-body">
                    <table class="table table-sm align-middle mb-0" id="currenciesTable">
                        <thead>
                        <tr>
                            <th style="width: 25%">Code</th>
                            <th>Name</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" type="text/javascript"></script>
<script type="text/javascript">window.melodyRoutes = JSON.parse('{{routes_json}}');</script>
<script type="text/javascript">window.melodyViewer = JSON.parse('{{viewer_json}}');</script>
<script src="/assets/app.js" type="text/javascript"></script>
<script type="text/javascript">
    $(document).ready(() => {
        const categoriesBody = $('#categoriesTable tbody');
        const currenciesBody = $('#currenciesTable tbody');
        if (0 === categoriesBody.length || 0 === currenciesBody.length) {
            return;
        }

        const renderRows = (tableBody, items, firstKey, secondKey) => {
            tableBody.empty();

            if (0 === items.length) {
                const emptyRow = $('<tr/>');
                $('<td/>').attr('colspan', 2).addClass('text-muted').text('Nothing recorded.').appendTo(emptyRow);
                tableBody.append(emptyRow);
                return;
            }

            for (const item of items) {
                const row = $('<tr/>');
                $('<td/>').text(String(item?.[firstKey] ?? '').trim()).appendTo(row);
                $('<td/>').text(String(item?.[secondKey] ?? '').trim()).appendTo(row);
                tableBody.append(row);
            }
        };

        const load = async () => {
            window.melodyExample.ui.setStatus('Loading catalogue...');

            try {
                const categoriesResult = await window.melodyExample.http.getJson(
                    window.melodyExample.routing.route('example.categories.api.read.all')
                );
                const currenciesResult = await window.melodyExample.http.getJson(
                    window.melodyExample.routing.route('example.currencies.api.read.all')
                );

                renderRows(categoriesBody, Array.isArray(categoriesResult?.payload) ? categoriesResult.payload : [], 'id', 'name');
                renderRows(currenciesBody, Array.isArray(currenciesResult?.payload) ? currenciesResult.payload : [], 'code', 'name');

                window.melodyExample.ui.setStatus('');
            } catch (err) {
                window.melodyExample.ui.setStatus(String(err?.message ?? err), 'danger');
            }
        };

        void load();
    });
</script>
</body>
</html>
