name: ci

on:
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:

jobs:
    # vet + test for every workspace module, across the build-tag matrix the
    # local `.dev/validate/all.sh` (mva) runs: no tags, env-embedded,
    # static-embedded, and both.
    matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                tags: [ '', 'melody_env_embedded', 'melody_static_embedded', 'melody_env_embedded,melody_static_embedded' ]
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-go@v5
                with:
                    go-version-file: go.work
                    cache: true
            -   name: vet and test all workspace modules
                env:
                    GOFLAGS: ${{ matrix.tags != '' && format('-tags={0}', matrix.tags) || '' }}
                run: |
                    set -euo pipefail
                    for module_directory in $(go list -m -f '{{.Dir}}' | sort); do
                        echo "=== ${module_directory} (tags: '${{ matrix.tags }}') ==="
                        (cd "${module_directory}" && go vet ./... && go test ./...)
                    done
            # the e2e harness module sits outside go.work on purpose (it builds
            # GOWORK=off against the local replaces), so the workspace loop above
            # never compiles it; without this a break in the harness — or a stale
            # framework pin in its go.mod — surfaces only when someone runs
            # run.sh/stack.sh by hand. Mirrors run_e2e_harness_checks in
            # `.dev/validate/all.sh`.
            -   name: vet and test the e2e harness module (outside the workspace)
                if: matrix.tags == ''
                env:
                    GOWORK: "off"
                run: |
                    set -euo pipefail
                    (cd .dev/e2e && go vet ./...)
                    (cd .dev/e2e && go test -count=1 ./...)

    # the package documents against the code of every major. The three majors are near-copies whose
    # documents drifted independently, and nothing compared them: a symbol one major documents while
    # another ships it undocumented is invisible to every compiler and every test. Reads the tree only,
    # so it needs neither Go nor a service container. Mirrors run_documentation_checks in
    # `.dev/validate/all.sh`.
    documentation:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: package documentation against every major
                run: .dev/validate/documentation.sh

    # the race detector over the concurrency-carrying packages of the core majors
    # and the cron runner. The matrix job runs them without it, so a lost mutex or
    # an unsynchronized memo stays green there: these packages hold goroutines that
    # outlive a call (the lazy service memo, the signal watcher, the smtp
    # cancellation watcher, the http client's redirect policy reading the header
    # map, the logger's shared writer, the message bus dispatch, the cron runner's
    # parallel dispatch), and only the detector can see them race — several of
    # those tests assert nothing at all, so without this lane they can only ever
    # pass. Needs no service containers.
    race:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-go@v5
                with:
                    go-version-file: go.work
                    cache: true
            -   name: race detector on the concurrency-carrying core packages
                run: |
                    set -euo pipefail
                    for major_directory in . v2 v3; do
                        (cd "${major_directory}" && go test -race -count=1 ./cache/... ./clock/... ./container/... ./application/... ./config/... ./event/... ./httpclient/... ./logging/... ./cli/... ./validation/... ./session/... ./http/... ./internal/...)
                    done
                    (cd v3 && go test -race -count=1 ./mailer/... ./lock/... ./messagebus/... ./openapi/... ./security/...)
                    for cron_directory in integrations/cron integrations/cron/v2 integrations/cron/v3; do
                        (cd "${cron_directory}" && go test -race -count=1 ./...)
                    done

    # the env-gated live suites the matrix job cannot exercise: real RabbitMQ,
    # Redis, MySQL, PostgreSQL and S3 (localstack) service containers. Every
    # integration module is discovered and run with the race detector, so a module
    # added later joins this lane on its own and a race inside an integration —
    # which no other lane covers — is caught. Mirrors run_live_go_suites in
    # `.dev/validate/all.sh`.
    live:
        runs-on: ubuntu-latest
        services:
            rabbitmq:
                image: rabbitmq:3.13
                ports: [ '5672:5672' ]
            redis:
                image: redis:7-alpine
                ports: [ '6379:6379' ]
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: melody_example
                    MYSQL_USER: melody
                    MYSQL_PASSWORD: melody
                ports: [ '3306:3306' ]
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -proot"
                    --health-interval=5s --health-timeout=5s --health-retries=20
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: melody
                    POSTGRES_PASSWORD: melody
                    POSTGRES_DB: melody_test
                ports: [ '5432:5432' ]
                options: >-
                    --health-cmd="pg_isready -U melody"
                    --health-interval=5s --health-timeout=5s --health-retries=20
            localstack:
                image: localstack/localstack:3.8
                env:
                    SERVICES: s3
                ports: [ '4566:4566' ]
        env:
            AMQP_DSN: amqp://guest:guest@localhost:5672/
            REDIS_ADDRESS: localhost:6379
            MYSQL_DSN: melody:melody@tcp(localhost:3306)/melody_example
            PGSQL_HOST: localhost
            PGSQL_PORT: '5432'
            PGSQL_DATABASE: melody_test
            PGSQL_USER: melody
            PGSQL_PASSWORD: melody
            POSTGRES_DSN: postgres://melody:melody@localhost:5432/melody_test?sslmode=disable
            MINIO_ENDPOINT: localhost:4566
            MINIO_ACCESS_KEY: test
            MINIO_SECRET_KEY: test
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-go@v5
                with:
                    go-version-file: go.work
                    cache: true
            -   name: live suites (every integration module, race detector on)
                run: |
                    set -euo pipefail
                    # discovered rather than listed, mirroring run_live_go_suites in
                    # `.dev/validate/all.sh`: a module added later joins this lane
                    # without anyone remembering to register it. The suites are gated
                    # on their backend environment variables, so a module with no live
                    # test simply runs its ordinary tests again.
                    find integrations -name go.mod -print0 |
                        while IFS= read -r -d '' MODULE_GO_MOD_PATH; do
                            MODULE_DIRECTORY="$(dirname "${MODULE_GO_MOD_PATH}")"
                            echo "::group::live ${MODULE_DIRECTORY}"
                            (cd "${MODULE_DIRECTORY}" && go test -race -count=1 ./...)
                            echo "::endgroup::"
                        done

    # the live e2e harness and the stack checks: the only lane that drives booted applications over the
    # wire. Every other job compiles the harness and runs its unit tests, so a middleware whose ordering
    # only matters once a real request traverses the chain, a route the router registers but never answers,
    # or a session cookie that never reaches the wire is invisible to all of them. Unlike the jobs above
    # this one needs the compose stack rather than service containers — prometheus and the load balancer
    # are configured from files in `.dev/docker/`, which a `services:` container cannot mount — so it runs
    # `.dev/validate/all.sh --e2e`, the same entry point a developer runs, and the stack comes up through
    # the same wrapper. It is kept off pull requests because it builds the dev image and boots four
    # applications; `workflow_dispatch` runs it on a branch on demand.
    e2e:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            -   uses: actions/checkout@v4
            -   name: live e2e harness and stack checks
                run: .dev/validate/all.sh --e2e
            -   name: compose logs on failure
                if: failure()
                run: docker compose -f .dev/docker/docker-compose.yml --env-file .dev/docker/.env logs --tail=200
